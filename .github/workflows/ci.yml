name: CI

# pstack 落地的「shipping 前提」：合并前必须有可复跑的门禁。
# 门禁口径统一走 scripts/verify.sh，本地和 CI 是同一套命令，避免「本地过了 CI 挂」。

on:
  pull_request:
    # edited：PR 正文被改（审核/验证栏位填进正文）时要重跑，否则填完仍是红，只能靠空提交解堵。
    # 代价：每次改正文会重跑整个 CI（concurrency 会取消进行中的旧运行）。
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 每周一 02:00 UTC 跑一次依赖体检（见 deps-audit）
    - cron: '0 2 * * 1'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify（pytest + 静态门禁）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 与生产一致：服务器是 Python 3.14
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装测试依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-dev.txt

      - name: 一键验证
        run: bash scripts/verify.sh

  shellcheck:
    name: shellcheck（发布脚本）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          shellcheck --version
          # 只查本 PR 引入的脚本。deploy/refresh.sh 是既有生产数据脚本，
          # 它有个既有的 SC2034（未使用的 TS），单独一次小改动修理，不混进本 PR。
          shellcheck -S warning deploy/release.sh deploy/set-gh-token.sh deploy/install-timers.sh scripts/verify.sh scripts/check_pr_review.sh

  pr-review-gate:
    # name 就是分支保护引用的 check 名，改了就等于把门禁摘掉 —— 不要动。
    name: 流程门禁
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 正文直接取事件负载，不调 GitHub API：少一次网络依赖，也不用给这个 job 额外 token 权限。
      - name: 取出 PR 正文与作者
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          printf '%s\n' "${PR_BODY:-}" > "$RUNNER_TEMP/pr_body.md"
          printf '%s\n' "$PR_AUTHOR" > "$RUNNER_TEMP/pr_author.txt"

      - name: 自检：门禁自己先证明「能过」也能拦
        # 门禁最怕的不是拦不住，而是永远红：那会让所有 PR 永久无法合并。
        # 所以每次都用固定样本跑一遍：填齐要 PASS，四种违规形态都要 FAIL。
        run: |
          set -e
          bash scripts/check_pr_review.sh --body-file scripts/fixtures/pr-body-filled.md --author fixture-author
          echo "自检 1/4 → 填齐的正文判 PASS"

          check_fail() {   # $1=样本文件名 $2=序号 + 说明
            if bash scripts/check_pr_review.sh --body-file "scripts/fixtures/$1" --author fixture-author; then
              echo "::error::自检失败：$2 竟然也判 PASS"
              exit 1
            fi
            echo "自检 $2 → 判 FAIL（预期返回非 0）"
          }
          check_fail pr-body-missing.md "2/4 缺栏位"
          check_fail pr-body-fail.md "3/4 三态勾 FAIL（验证说不可合并）"
          check_fail pr-body-author-suffix.md "4/4 验证者写成作者名 +（代签）"

      - name: 校验「审核三段式」与「独立验证三态」
        run: |
          bash scripts/check_pr_review.sh \
            --body-file "$RUNNER_TEMP/pr_body.md" \
            --author "$(cat "$RUNNER_TEMP/pr_author.txt")"

  deps-audit:
    name: 依赖漏洞体检（仅定时/手动，不阻断合并）
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: pip-audit
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r backend/requirements-dev.txt || echo "::warning::依赖存在已知漏洞，见上（不阻断合并，按 P2 排期处理）"
