name: CI

# 门禁口径统一走 scripts/verify.sh，本地和 CI 是同一套命令，避免「本地过了 CI 挂」。
#
# 2026-11-25 起：CI 只作提示，不再阻断合并（宝拉：人工合并那一步走不通，先让「有 PR」就能收口）。
# 做法是保住 job 的 name（分支保护按 name 认 required check），把结论固定成成功：
#   - verify / shellcheck / 流程门禁 三个 job 的检查步骤都 continue-on-error，
#     失败只打 ::warning:: 和日志，job 本身仍然绿 —— 否则 required check 永远红，PR 永远合不了。
#   - 三个 name 一个字都不能改：改名 = required check 永远 pending，比红更糟。
# 想恢复阻断：把对应步骤的 continue-on-error / `|| true` 去掉即可。

on:
  pull_request:
    # edited：PR 正文被改（审核/验证栏位填进正文）时要重跑，否则填完仍是红，只能靠空提交解堵。
    # 代价：每次改正文会重跑整个 CI（concurrency 会取消进行中的旧运行）。
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 每周一 02:00 UTC 跑一次依赖体检（见 deps-audit）
    - cron: '0 2 * * 1'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify（pytest + 静态门禁）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 与生产一致：服务器是 Python 3.14
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装测试依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-dev.txt

      - name: 一键验证（只作提示，不阻断）
        id: verify
        continue-on-error: true
        run: bash scripts/verify.sh

      - name: 验证结果只是提示
        if: steps.verify.outcome == 'failure'
        run: |
          echo "::warning::scripts/verify.sh 有失败项 —— 仅作提示，不阻断合并。失败明细见上一步日志。"
          echo "### ⚠️ verify 有失败项（仅提示，不阻断合并）" >> "$GITHUB_STEP_SUMMARY"
          echo "明细见 “一键验证” 步骤日志。" >> "$GITHUB_STEP_SUMMARY"

  shellcheck:
    name: shellcheck（发布脚本）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck（只作提示，不阻断）
        id: shellcheck
        continue-on-error: true
        run: |
          shellcheck --version
          # 只查本 PR 引入的脚本。deploy/refresh.sh 是既有生产数据脚本，
          # 它有个既有的 SC2034（未使用的 TS），单独一次小改动修理，不混进本 PR。
          shellcheck -S warning deploy/release.sh deploy/set-gh-token.sh deploy/install-timers.sh scripts/verify.sh scripts/check_pr_review.sh

      - name: shellcheck 结果只是提示
        if: steps.shellcheck.outcome == 'failure'
        run: |
          echo "::warning::shellcheck 有告警 —— 仅作提示，不阻断合并。明细见上一步日志。"
          echo "### ⚠️ shellcheck 有告警（仅提示，不阻断合并）" >> "$GITHUB_STEP_SUMMARY"

  pr-review-gate:
    # name 就是分支保护引用的 check 名，改了就等于把门禁摘掉 —— 不要动。
    name: 流程门禁
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 正文直接取事件负载，不调 GitHub API：少一次网络依赖，也不用给这个 job 额外 token 权限。
      - name: 取出 PR 正文与作者
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          printf '%s\n' "${PR_BODY:-}" > "$RUNNER_TEMP/pr_body.md"
          printf '%s\n' "$PR_AUTHOR" > "$RUNNER_TEMP/pr_author.txt"

      - name: 自检：门禁自己先证明「能过」也能拦（只作提示）
        # 门禁最怕的不是拦不住，而是永远红：那会让所有 PR 永久无法合并。
        # 所以每次都用固定样本跑一遍：填齐要 PASS、缺栏位要 FAIL。
        continue-on-error: true
        run: |
          set -e
          bash scripts/check_pr_review.sh --body-file scripts/fixtures/pr-body-filled.md --author fixture-author
          echo "自检 1/2 通过：填齐的正文判 PASS"
          if bash scripts/check_pr_review.sh --body-file scripts/fixtures/pr-body-missing.md --author fixture-author; then
            echo "::error::自检失败：缺栏位的正文竟然也判 PASS"
            exit 1
          fi
          echo "自检 2/2 通过：缺栏位的正文判 FAIL（预期返回 1）"

      - name: 校验「审核三段式」与「独立验证三态」（只作提示，不阻断）
        id: review_gate
        continue-on-error: true
        run: |
          bash scripts/check_pr_review.sh \
            --body-file "$RUNNER_TEMP/pr_body.md" \
            --author "$(cat "$RUNNER_TEMP/pr_author.txt")"

      - name: 流程门禁结果只是提示
        if: steps.review_gate.outcome == 'failure'
        run: |
          echo "::warning::PR 正文的审核/验证栏位没填齐 —— 仅作提示，不阻断合并。"
          echo "### ⚠️ 流程门禁未通过（仅提示，不阻断合并）" >> "$GITHUB_STEP_SUMMARY"
          echo "建议用「审核范围报告 / 三段式」随手补一下；没补也不挡合并。" >> "$GITHUB_STEP_SUMMARY"

  review-gate:
    # 审核范围报告：没有报告、四栏没填实、范围清单漏了 diff 的文件，都会报出来。
    # 与之互补的是 pr-review-gate（PR 正文三段式）——一个管「审了什么范围」，一个管「谁签的字」。
    # 2026-11-25 起只作提示、不阻断合并（同本文件头口径）；name 未改。
    name: review-gate（审核范围报告）
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 要跟目标分支算 merge-base，浅克隆不够
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: 自检：门禁自己先证明「能过」也能拦（只作提示）
        # 门禁最怕永远红；固定样本每次跑一遍：填齐要 PASS，缺栏/漏文件/瞎写结论要 FAIL。
        continue-on-error: true
        run: python scripts/review_check.py --self-test

      - name: 校验审核范围报告（只作提示，不阻断）
        id: range_gate
        continue-on-error: true
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          python scripts/review_check.py --base "origin/${{ github.base_ref }}"

      - name: 审核范围报告结果只是提示
        if: steps.range_gate.outcome == 'failure'
        run: |
          echo "::warning::审核范围报告缺失或没填实 —— 仅作提示，不阻断合并。"
          echo "### ⚠️ 审核范围报告未通过（仅提示，不阻断合并）" >> "$GITHUB_STEP_SUMMARY"

  deps-audit:
    name: 依赖漏洞体检（仅定时/手动，不阻断合并）
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: pip-audit
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r backend/requirements-dev.txt || echo "::warning::依赖存在已知漏洞，见上（不阻断合并，按 P2 排期处理）"
